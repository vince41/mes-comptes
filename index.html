<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031a31"><title>Mes Comptes</title><link rel="manifest" href="manifest.webmanifest"><style>html,body{margin:0;background:#021323;color:#fff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#boot b{color:#f4c767;font-size:1.3rem}</style></head><body><div id="boot"><div><b>Mes Comptes</b><p>Chargement…</p></div></div><script>(async()=>{try{const[a,p]=await Promise.all([fetch('app.b64').then(r=>r.text()),fetch('photo.b64').then(r=>r.text())]);const bin=Uint8Array.from(atob(a.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const photo='data:image/webp;base64,'+p.trim();const importFix=`<script>(function(){function fix(){const btn=document.getElementById('importBtn'),input=document.getElementById('importFile'),st=document.getElementById('importState');if(!btn||!input)return;let n=0;try{const d=JSON.parse(localStorage.getItem('comptes-differe-v042')||'null');n=Array.isArray(d&&d.transactions)?d.transactions.length:0}catch(e){}btn.style.display='inline-flex';btn.classList.add('primary');btn.disabled=false;const bt=n?'Mettre à jour mon historique':'Charger mon historique privé';if(btn.textContent!==bt)btn.textContent=bt;const msg=n?n+' opérations chargées sur cet appareil':'Aucun historique chargé. Appuie sur le bouton puis choisis ton fichier JSON privé.';if(st&&st.textContent!==msg)st.textContent=msg;btn.onclick=function(ev){ev.preventDefault();ev.stopPropagation();input.click()};const card=btn.closest('.import-card');if(card){card.style.cursor='pointer';card.onclick=function(ev){if(ev.target.closest('button,label,input'))return;input.click()}}}fix();const card=document.getElementById('importBtn')&&document.getElementById('importBtn').closest('.import-card');if(card)new MutationObserver(function(){queueMicrotask(fix)}).observe(card,{subtree:true,childList:true,characterData:true})})();<\\/script>`;document.open();document.write(html.replaceAll('__PHOTO__',photo).replace('</body>',importFix+'</body>'));document.close()}catch(e){document.getElementById('boot').innerHTML='<div><b>Erreur de chargement</b><p>'+e.message+'</p></div>'}})();</script></body></html>
